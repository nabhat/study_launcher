name: Build GateFocus APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build APK with Gradle
      run: |
        if [ -f "build.gradle.kts" ]; then
          echo "Building from repository root..."
          gradle assembleDebug --no-daemon
        elif [ -d "study_launcher" ]; then
          echo "Building from study_launcher subfolder..."
          cd study_launcher
          gradle assembleDebug --no-daemon
        else
          echo "Could not find build.gradle.kts in root or study_launcher!"
          exit 1
        fi

    - name: Upload GateFocus APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GateFocus-StudyLauncher-APK
        path: "**/build/outputs/apk/debug/*.apk"
