name: Build GateFocus APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: |
        if [ -f "study_launcher/gradlew" ]; then
          chmod +x study_launcher/gradlew
        fi

    - name: Build APK with Gradle
      working-directory: study_launcher
      run: |
        gradle assembleDebug --no-daemon

    - name: Upload GateFocus APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GateFocus-StudyLauncher-APK
        path: study_launcher/app/build/outputs/apk/debug/app-debug.apk
